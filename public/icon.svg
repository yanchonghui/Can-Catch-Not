<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#090d16" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#busGrad)" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />
  <!-- Bus Body -->
  <g transform="translate(106, 96)">
    <rect x="0" y="20" width="300" height="260" rx="36" fill="url(#busGrad)" />
    <!-- Route Display LED -->
    <rect x="50" y="44" width="200" height="34" rx="8" fill="#000000" />
    <text x="150" y="68" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">65 ORCHARD</text>
    <!-- Windshield -->
    <rect x="25" y="94" width="250" height="90" rx="14" fill="url(#windshieldGrad)" />
    <!-- Windshield wiper & reflection -->
    <path d="M 40 106 L 160 170" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <!-- Headlights -->
    <circle cx="56" cy="226" r="18" fill="#fef08a" />
    <circle cx="244" cy="226" r="18" fill="#fef08a" />
    <circle cx="56" cy="226" r="8" fill="#ffffff" />
    <circle cx="244" cy="226" r="8" fill="#ffffff" />
    <!-- Grille & SG plate -->
    <rect x="110" y="214" width="80" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="150" y="232" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SBS 6588T</text>
    <!-- Wheels -->
    <rect x="40" y="274" width="36" height="30" rx="8" fill="#0f172a" />
    <rect x="224" y="274" width="36" height="30" rx="8" fill="#0f172a" />
    <!-- Clock / Departure Indicator Overlay -->
    <circle cx="250" cy="50" r="42" fill="#0284c7" stroke="#ffffff" stroke-width="4" />
    <path d="M 250 24 L 250 50 L 268 50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
