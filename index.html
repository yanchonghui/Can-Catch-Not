    <script>
      (function() {
        // 1. Stub Vite development HMR WebSocket in preview sandbox
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          var MockViteWebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (protocols === 'vite-hmr' || urlStr.indexOf('vite') !== -1 || urlStr.indexOf('3000') !== -1) {
              var listeners = {};
              return {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: urlStr,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(event, callback) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(callback);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { callback({ type: 'open' }); } catch (e) {}
                    }, 5);
                  }
                },
                removeEventListener: function(event, callback) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {}
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          window.WebSocket = MockViteWebSocket;
        }

        // 2. Filter any WebSocket error notices in console
        var origError = console.error;
        console.error = function() {
          var msg = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            msg += (arg && arg.stack ? arg.stack : String(arg)) + ' ';
          }
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
